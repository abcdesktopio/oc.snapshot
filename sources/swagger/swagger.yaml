openapi: 3.0.3
info:
  title: Nerdctl Snapshot API
  description: API for managing container snapshots using Nerdctl
  version: "1.0.0"

paths:
  /version:
    get:
      summary: Retrieve API version
      operationId: getApiVersion
      tags:
        - Version
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /snapshot:
    post:
      summary: Create a new system snapshot
      operationId: createSnapshot
      tags:
        - Snapshot
      responses:
        '200':
          description: Snapshot successfully created and pushed to registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /snapshot/{session_id}:
    get:
      summary: Retrieve snapshot status by session ID
      operationId: getSnapshotStatus
      tags:
        - Snapshot
      parameters:
        - name: session_id
          in: path
          required: true
          description: Unique session identifier
          schema:
            type: string
      responses:
        '200':
          description: Snapshot status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Session ID not found in cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /snapshots:
    get:
      summary: Retrieve snapshot operations status and sessions for current user.




  /swagger:
    get:
      summary: Return the Swagger API specification
      operationId: getSwaggerSpec
      tags:
        - Documentation
      description: |
        Retrieves the list of snapshot sessions and their status for the current user.
        The user is determined internally (e.g., via a constant like `ABCDESKTOP_USERID`).
      tags:
        - Snapshots
      responses:
        '200':
          description: List of snapshots found for the user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                          example: abc123
                        status:
                          type: string
                          example: done
                  status:
                    type: string
                    example: success
                  timestamp:
                    type: string
                    format: date-time
                  session_id:
                    type: string
                    example: none
                  api_version:
                    type: string
                    example: v1.0.0
        '404':
          description: No snapshots found for the user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: no snapshot operations
                  status:
                    type: string
                    example: error
                  timestamp:
                    type: string
                    format: date-time
                  session_id:
                    type: string
                    example: none
                  api_version:
                    type: string
                    example: v1.0.0

components:
  schemas:
    StandardResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable message describing the result
        status:
          type: string
          enum: [success, error]
          description: Status of the operation
        timestamp:
          type: string
          format: date-time
          description: Time at which the response was generated
        session_id:
          type: string
          description: Unique identifier for the session

