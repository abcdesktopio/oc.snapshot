openapi: 3.0.3
info:
  title: Nerdctl Snapshot API
  description: API for managing container snapshots using Nerdctl
  version: "1.0.0"

paths:
  /version:
    get:
      summary: Retrieve API version
      operationId: getApiVersion
      tags:
        - Version
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /snapshot:
    post:
      summary: Create a new system snapshot
      operationId: createSnapshot
      tags:
        - Snapshot
      responses:
        '200':
          description: Snapshot successfully created and pushed to registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /snapshot/{session_id}:
    get:
      summary: Retrieve snapshot status by session ID
      operationId: getSnapshotStatus
      tags:
        - Snapshot
      parameters:
        - name: session_id
          in: path
          required: true
          description: Unique session identifier
          schema:
            type: string
      responses:
        '200':
          description: Snapshot status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Session ID not found in cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /swagger:
    get:
      summary: Return the Swagger API specification
      operationId: getSwaggerSpec
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI specification returned successfully
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    StandardResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable message describing the result
        status:
          type: string
          enum: [success, error]
          description: Status of the operation
        timestamp:
          type: string
          format: date-time
          description: Time at which the response was generated
        session_id:
          type: string
          description: Unique identifier for the session
